<!DOCTYPE html>
<html>

<head>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 512px;
            height: 512px;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 512px;
            height: 512px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo {
            font-family: 'Times New Roman', Times, serif;
            font-size: 300px;
            font-weight: bold;
            color: white;
            /* Adjust line-height and verify vertical center */
            line-height: 1;
            /* Optical adjustment since fonts often have padding */
            transform: translateY(-5%);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">FF</div>
    </div>
</body>

</html>
